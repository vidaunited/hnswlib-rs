name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, lib tests, examples, docs (no hdf5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Library tests
        run: cargo test --lib
      - name: Examples (default features)
        run: cargo build --examples
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  hdf5-and-integration:
    name: hdf5 examples + integration tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install libhdf5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: hdf5-release
      - name: Clippy with hdf5 feature
        run: cargo clippy --all-targets --features hdf5 -- -D warnings
      - name: Examples with hdf5 feature
        run: cargo build --examples --features hdf5
      # The integration tests (tests/equality.rs in particular) build 10k-point
      # indexes and take far too long in a debug build; in release they finish
      # in well under a minute.
      - name: Integration and unit tests (release)
        run: cargo test --release --tests
